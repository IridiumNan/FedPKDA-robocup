<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>事件中心 · FedPKDA</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="layout">
<aside class="sidebar">
  <div class="sidebar-logo"><i class="fas fa-shield-haltered"></i>Fed<span>PKDA</span></div>
  <nav class="sidebar-nav">
    <a href="event_center.html" class="nav-item active"><i class="fas fa-bell"></i>事件中心<span class="nav-badge">2</span></a>
    <a href="node_management.html" class="nav-item"><i class="fas fa-building"></i>节点管理</a>
    <a href="node_status.html" class="nav-item"><i class="fas fa-server"></i>节点状态</a>
    <a href="training.html" class="nav-item"><i class="fas fa-microchip"></i>训练控制</a>
    <a href="architecture.html" class="nav-item"><i class="fas fa-project-diagram"></i>系统架构</a>
  </nav>
  <div class="sidebar-footer"><span class="status-dot online"></span>系统运行中 · 联盟协调员</div>
</aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1><i class="fas fa-bell"></i>事件中心</h1>
      <div class="sub"><i class="fas fa-sync-alt fa-fw pulse-icon"></i>系统自动检测 · 需要关注的事件实时更新</div>
    </div>
    <span class="badge badge-blue"><i class="fas fa-eye"></i>联盟协调员</span>
  </div>

  <div class="grid-3">
    <div class="card stat-card accent-blue">
      <div class="card-h"><i class="fas fa-bullseye"></i>全局检测率</div>
      <div class="stat-number">45.1<span class="stat-unit">%</span></div>
      <div class="stat-label trend-up"><i class="fas fa-arrow-up"></i> +1.2% vs 上轮</div>
    </div>
    <div class="card stat-card">
      <div class="card-h"><i class="fas fa-layer-group"></i>当前训练轮次</div>
      <div class="stat-number">38<span class="stat-unit"> / 40</span></div>
      <div class="stat-label">剩余约 8 分钟 · 每轮 4.2 min</div>
    </div>
    <div class="card stat-card accent-warning">
      <div class="card-h"><i class="fas fa-users"></i>活跃节点</div>
      <div class="stat-number">4<span class="stat-unit">/5</span></div>
      <div class="stat-label" style="color:var(--warning)"><span class="status-dot offline"></span>1 个节点离线</div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><i class="fas fa-clock"></i>事件时间线<span class="badge badge-red" style="margin-left:8px">2 待处理</span></div>
    <div id="timeline"></div>
  </div>

  <div id="toast" class="toast"></div>
</main>

<script>
const events = [
  { id:0, time:'14:32', icon:'⚠️', title:'节点 浦发银行 (BANK-03) 行为偏离 4.2σ（阈值 3.0σ）',
    desc:'该节点本轮上传的原型向量与全局质心的马氏距离超标。建议通知该机构自查本地数据质量，排除数据投毒或系统被攻陷的可能性。',
    actions:['📡 广播通知','✓ 标记已处理'], urgent:true, done:false },
  { id:1, time:'13:15', icon:'📉', title:'全局检测率连续 5 轮下降（46.3% → 44.1%）',
    desc:'检测率已跌破历史均值。可能原因：各节点本地数据出现概念漂移，或全局聚合参数需要调整。建议各节点增加本地训练轮次。',
    actions:['📡 广播通知','🔧 调整参数'], urgent:true, done:false },
  { id:2, time:'09:47', icon:'🆕', title:'系统检测到新型攻击模式（来源匿名）',
    desc:'全局模型在某成员机构本地推理时检出未知攻击类型，置信度 87%。该模式已通过原型机制自动纳入全局模型。建议各机构同步攻击库。',
    actions:['📡 广播通知','✓ 标记已处理'], urgent:false, done:false },
  { id:3, time:'08:02', icon:'🔴', title:'节点 南方电网 (ENG-02) 已离线超过 3 轮',
    desc:'最近一次响应时间 07:45。建议协调员联系该机构安全负责人（陈工 135-xxxx-7890）确认运行状态。',
    actions:['📡 广播通知','✓ 标记已处理'], urgent:false, done:false },
  { id:4, time:'02:30', icon:'✅', title:'第 38 轮联邦训练完成',
    desc:'全局检测率 45.1%（+1.2%），本轮耗时 4.2 分钟，参与节点 4/5，聚合权重分布正常。',
    actions:['✓ 标记已处理'], urgent:false, done:true },
  { id:5, time:'昨天 22:15', icon:'✅', title:'第 37 轮联邦训练完成',
    desc:'全局检测率 43.9%（+0.8%），本轮耗时 4.1 分钟，参与节点 4/5。',
    actions:['✓ 标记已处理'], urgent:false, done:true },
  { id:6, time:'昨天 18:30', icon:'⚠️', title:'节点 省电力调度中心 (ENG-01) 行为偏离 2.8σ（低于阈值）',
    desc:'偏离度在警戒线以下，系统自动保持关注。无需立即处理。',
    actions:['✓ 标记已处理'], urgent:false, done:true },
];

function render() {
  document.getElementById('timeline').innerHTML = events.map(ev => `
    <div class="event-row${ev.urgent?' event-urgent':''}${ev.done?' event-done':''}">
      <div class="event-time">${ev.time}</div>
      <div class="event-body">
        <div class="event-title">${ev.icon} ${ev.title}</div>
        <div class="event-desc">${ev.desc}</div>
        <div class="event-actions">
          ${ev.actions.map(a => {
            if(a.includes('广播')) return `<button class="btn btn-sm btn-primary" onclick="handle(${ev.id},'broadcast')">${a}</button>`;
            if(a.includes('标记')) return `<button class="btn btn-sm btn-ghost" onclick="handle(${ev.id},'done')">${a}</button>`;
            if(a.includes('调整')) return `<button class="btn btn-sm btn-ghost" onclick="handle(${ev.id},'tune')">${a}</button>`;
            return '';
          }).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function handle(id, action) {
  const ev = events.find(e => e.id === id);
  if (!ev || ev.done) return;
  const t = document.getElementById('toast');
  if (action === 'broadcast') {
    t.innerHTML = '<i class="fas fa-check-circle"></i> 已广播通知所有成员机构';
    t.className = 'toast show toast-success';
  } else if (action === 'done') {
    ev.done = true; render();
    t.innerHTML = '<i class="fas fa-check"></i> 已标记为已处理';
    t.className = 'toast show toast-success';
  } else {
    t.innerHTML = '<i class="fas fa-cog"></i> 已跳转到训练控制页面';
    t.className = 'toast show';
  }
  setTimeout(() => t.className = 'toast', 2500);
}

render();
</script>
</body>
</html>
