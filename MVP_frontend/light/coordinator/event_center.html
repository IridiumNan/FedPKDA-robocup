<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>事件中心 · FedPKDA</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="layout">
<aside class="sidebar">
  <div class="sidebar-logo"><i class="fas fa-shield-haltered"></i>Fed<span>PKDA</span></div>
  <nav class="sidebar-nav">
    <a href="event_center.html" class="nav-item active"><i class="fas fa-bell"></i>事件中心<span class="nav-badge">3</span></a>
    <a href="node_management.html" class="nav-item"><i class="fas fa-building"></i>节点管理</a>
    <a href="training.html" class="nav-item"><i class="fas fa-microchip"></i>训练控制</a>
    <a href="architecture.html" class="nav-item"><i class="fas fa-project-diagram"></i>系统架构</a>
  </nav>
  <div class="sidebar-footer"><span class="status-dot online"></span>系统运行中 · 联盟协调员</div>
</aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1><i class="fas fa-bell"></i>事件中心</h1>
      <div class="sub"><i class="fas fa-sync-alt fa-fw"></i>系统自动检测 · 需要关注的事件实时更新</div>
    </div>
    <span class="badge badge-blue"><i class="fas fa-eye"></i>联盟协调员</span>
  </div>

  <div class="grid-3">
    <div class="card stat-card accent-blue">
      <div class="card-h"><i class="fas fa-bullseye"></i>全局检测率</div>
      <div class="stat-number">45.1<span class="stat-unit">%</span></div>
      <div class="stat-label trend-up"><i class="fas fa-arrow-up"></i> +1.2% vs 上轮</div>
    </div>
    <div class="card stat-card">
      <div class="card-h"><i class="fas fa-layer-group"></i>当前训练轮次</div>
      <div class="stat-number">38<span class="stat-unit"> / 40</span></div>
      <div class="stat-label">剩余约 8 分钟 · 每轮 4.2 min</div>
    </div>
    <div class="card stat-card accent-warning">
      <div class="card-h"><i class="fas fa-users"></i>活跃节点</div>
      <div class="stat-number">22<span class="stat-unit">/24</span></div>
      <div class="stat-label" style="color:var(--warning)"><span class="status-dot offline"></span>2 个异常节点</div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><i class="fas fa-clock"></i>事件时间线<span class="badge badge-red" style="margin-left:8px">3 待处理</span></div>
    <div id="timeline"></div>
  </div>
  <div id="toast" class="toast"></div>
</main>

<script>
const events=[{id:0,time:'14:32',icon:'⚠️',title:'节点 市商行数据中心 (BANK-COM-03) 行为偏离 4.2σ',desc:'该节点本轮上传原型向量马氏距离 4.2σ，超过阈值 3.0σ。全局聚合已自动降权。建议通知该机构安全负责人排查本地训练数据是否存在污染。',actions:['📡 广播通知','✓ 标记已处理'],urgent:true,done:false},{id:1,time:'13:15',icon:'📉',title:'全局检测率连续 5 轮下降（46.3% → 44.1%），触发趋势告警',desc:'累计降幅 2.2%。可能原因：各节点数据漂移 / global_par 过大 / 异常节点污染效应。建议调整全局参数或通知各节点增加本地训练轮次。',actions:['📡 广播通知','🔧 调整参数'],urgent:true,done:false},{id:2,time:'11:08',icon:'⚠️',title:'节点 区域能源网络中心 连续 3 轮贡献度为零',desc:'Fisher 权重已降至 0.00 且连续 3 轮无有效贡献。节点仍在线但训练输出无效，疑似特征提取器过拟合。',actions:['📡 广播通知','✓ 标记已处理'],urgent:true,done:false},{id:3,time:'09:47',icon:'🆕',title:'系统检测到新型攻击模式（来源匿名）',desc:'某成员机构本地推理检出未知攻击类型，置信度 87%。已通过原型机制自动纳入全局模型。',actions:['📡 广播通知','✓ 标记已处理'],urgent:false,done:false},{id:4,time:'08:02',icon:'🔴',title:'节点 区域能源网络中心 已离线超过 3 轮',desc:'最近心跳 07:45。该 IDS 节点离线后联盟缺少该机构的网络流量特征。建议协调员联系负责人确认状态。',actions:['📡 广播通知','✓ 标记已处理'],urgent:false,done:false},{id:5,time:'02:30',icon:'✅',title:'第 38 轮联邦训练完成',desc:'检测率 45.1%（+1.2%），耗时 4.2 min，参与 22/24 节点。检测率回升表明参数调整生效。',actions:['✓ 标记已处理'],urgent:false,done:true},{id:6,time:'昨天 18:30',icon:'⚠️',title:'节点 省电力调度中心 行为偏离 2.8σ（低于阈值，持续监控）',desc:'近 3 轮趋势 2.1→2.5→2.8σ。暂未触发告警，系统自动纳入关注列表。',actions:['✓ 标记已处理'],urgent:false,done:true},{id:7,time:'昨天 14:12',icon:'📊',title:'第 37 轮联邦训练完成',desc:'检测率 43.9%（+0.8%），耗时 4.1 min，参与 22/24 节点。市商行节点 Fisher 异常下降（0.31→0.14）。',actions:['✓ 标记已处理'],urgent:false,done:true}];
function render(){document.getElementById('timeline').innerHTML=events.map(e=>`<div class="event-row${e.urgent?' event-urgent':''}${e.done?' event-done':''}"><div class="event-time">${e.time}</div><div class="event-body"><div class="event-title">${e.icon} ${e.title}</div><div class="event-desc">${e.desc}</div><div class="event-actions">${e.actions.map(a=>a.includes('广播')?`<button class="btn btn-sm btn-primary" onclick="act(${e.id},'b')">${a}</button>`:a.includes('标记')?`<button class="btn btn-sm btn-ghost" onclick="act(${e.id},'d')">${a}</button>`:`<button class="btn btn-sm btn-ghost" onclick="act(${e.id},'t')">${a}</button>`).join('')}</div></div></div>`).join('')}
function act(id,type){const e=events.find(x=>x.id===id);if(!e||e.done)return;const t=document.getElementById('toast');if(type==='b'){t.innerHTML='<i class="fas fa-check-circle"></i> 已广播通知所有成员机构';t.className='toast show toast-success'}else if(type==='d'){e.done=true;render();t.innerHTML='<i class="fas fa-check"></i> 已标记为已处理';t.className='toast show toast-success'}else{t.innerHTML='<i class="fas fa-cog"></i> 已跳转到训练控制页面';t.className='toast show'}setTimeout(()=>t.className='toast',2500)}
render();
</script>
</body>
</html>
