<main class="main">
  <div class="page-header">
    <div><h1><i class="fas fa-building"></i>节点管理</h1>
    <div class="sub"><i class="fas fa-info-circle"></i>管理联盟成员机构 · 仅综合评分，无内部数据访问</div></div>
    <div style="display:flex;gap:10px;"><span class="badge badge-blue"><i class="fas fa-eye"></i>联盟协调员</span><button class="btn btn-sm btn-primary"><i class="fas fa-plus"></i>添加机构</button></div>
  </div>
  <div class="card">
    <div class="card-h" style="display:flex;justify-content:space-between;"><span><i class="fas fa-list"></i>联盟成员机构 · <span id="nc">24</span> 个节点</span><span style="font-size:0.72rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-muted);"><span class="status-dot online"></span>在线 22 &nbsp;<span class="status-dot warning"></span>关注 1 &nbsp;<span class="status-dot offline"></span>离线 1</span></div>
    <table class="table"><thead><tr><th>状态</th><th>机构名称</th><th>行业</th><th>角色</th><th>活跃</th><th>评分</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table>
  </div>
  <div id="toast" class="toast"></div>
</main>

<script>
const N=[{id:'BANK-AGR-01',n:'省农商行清算中心',s:'金融',r:'训练+评估',st:'online',a:'14:30',sc:91,c:'刘工 138-xxxx-2341'},{id:'BANK-COM-01',n:'省会城市商业银行',s:'金融',r:'训练+评估',st:'online',a:'14:29',sc:88,c:'唐工 139-xxxx-3342'},{id:'BANK-RUR-01',n:'东部农信联合社',s:'金融',r:'训练',st:'online',a:'14:28',sc:84,c:'黄工 137-xxxx-4456'},{id:'BANK-COM-02',n:'中部城市商业银行',s:'金融',r:'评估',st:'online',a:'14:27',sc:79,c:'方工 136-xxxx-5567'},{id:'BANK-RUR-02',n:'南部农信联合社',s:'金融',r:'训练+评估',st:'online',a:'14:26',sc:86,c:'程工 135-xxxx-6678'},{id:'BANK-COM-03',n:'市商行数据中心',s:'金融',r:'被降权',st:'warning',a:'14:28',sc:47,c:'周工 139-xxxx-5578'},{id:'BANK-INS-01',n:'省保险资金结算中心',s:'金融',r:'训练',st:'online',a:'14:25',sc:75,c:'雷工 133-xxxx-7789'},{id:'BANK-SEC-01',n:'省证券交易清算中心',s:'金融',r:'评估',st:'online',a:'14:24',sc:72,c:'郑工 132-xxxx-8890'},{id:'GOV-CLD-01',n:'省政务云安全中心',s:'政务',r:'训练',st:'online',a:'14:31',sc:85,c:'林工 136-xxxx-9012'},{id:'GOV-CLD-02',n:'市政务数据管理中心',s:'政务',r:'训练+评估',st:'online',a:'14:23',sc:81,c:'许工 134-xxxx-0123'},{id:'GOV-TAX-01',n:'省税务信息中心',s:'政务',r:'评估',st:'online',a:'14:22',sc:77,c:'何工 131-xxxx-1234'},{id:'GOV-SS-01',n:'省社保数据平台',s:'政务',r:'训练',st:'online',a:'14:21',sc:74,c:'吕工 130-xxxx-2345'},{id:'GOV-TRF-01',n:'省交通信息管理中心',s:'政务',r:'评估',st:'online',a:'14:20',sc:70,c:'施工 129-xxxx-3456'},{id:'ENG-PWR-01',n:'省电力调度中心',s:'能源',r:'训练+评估',st:'online',a:'14:29',sc:78,c:'赵工 137-xxxx-3456'},{id:'ENG-PWR-02',n:'区域供电公司A',s:'能源',r:'训练',st:'online',a:'14:19',sc:73,c:'孙工 128-xxxx-4567'},{id:'ENG-PWR-03',n:'区域供电公司B',s:'能源',r:'评估',st:'online',a:'14:18',sc:69,c:'马工 127-xxxx-5678'},{id:'ENG-GAS-01',n:'省会城市燃气SCADA',s:'能源',r:'评估',st:'online',a:'14:27',sc:72,c:'杨工 133-xxxx-6789'},{id:'ENG-GAS-02',n:'区域燃气管网中心',s:'能源',r:'训练',st:'online',a:'14:17',sc:68,c:'朱工 126-xxxx-7890'},{id:'ENG-WTR-01',n:'省水务集团调度中心',s:'能源',r:'评估',st:'online',a:'14:16',sc:65,c:'秦工 125-xxxx-8901'},{id:'ENG-NET-02',n:'区域能源网络中心',s:'能源',r:'已降权',st:'offline',a:'07:45',sc:12,c:'陈工 135-xxxx-7890'},{id:'TEL-ISP-01',n:'省通信网络管理中心',s:'通信',r:'训练+评估',st:'online',a:'14:15',sc:76,c:'尤工 124-xxxx-9012'},{id:'TEL-ISP-02',n:'区域宽带运营中心',s:'通信',r:'训练',st:'online',a:'14:14',sc:71,c:'许工 123-xxxx-0123'},{id:'TEL-MOB-01',n:'移动通信核心网管中心',s:'通信',r:'评估',st:'online',a:'14:13',sc:67,c:'何工 122-xxxx-1234'},{id:'TRN-MET-01',n:'城市轨道交通控制中心',s:'交通',r:'训练',st:'online',a:'14:12',sc:63,c:'吕工 121-xxxx-2345'}];
function R(){document.getElementById('tb').innerHTML=N.map(n=>{const cl=n.st==='online'?'online':n.st==='warning'?'warning':'offline',lb=n.st==='online'?'在线':n.st==='warning'?'建议关注':'离线',bg=n.st==='offline'?'#fef2f2':n.st==='warning'?'#fffbeb':'',sc=n.sc>=80?'var(--success)':n.sc>=50?'var(--warning)':'var(--danger)',sb=n.sc>=80?'good':n.sc>=50?'warn':'bad',rt=n.r.includes('降权')?'danger':n.r.includes('训练+评估')?'primary':n.r==='训练'?'primary':'success',db=n.st==='offline'?'disabled':'',sl=n.st==='warning'?'↩ 取消':'⚠️ 建议关注',cl2=n.st==='warning'?'btn-success':'btn-ghost';return`<tr style="background:${bg}"><td><span class="status-dot ${cl}"></span>${lb}</td><td><strong>${n.n}</strong><br><small style="color:var(--text-muted)">${n.id}</small></td><td><span class="tag primary">${n.s}</span></td><td><span class="tag ${rt}">${n.r}</span></td><td>${n.st==='offline'?'<span style="color:var(--danger)">'+n.a+'（离线）</span>':n.a}</td><td><span style="color:${sc};font-weight:600;">${n.sc}</span>/100<div class="meter"><div class="meter-bar ${sb}" style="width:${n.sc}%"></div></div></td><td style="display:flex;gap:4px;"><button class="btn btn-sm ${cl2} ${db}" onclick="T('${n.st==='warning'?'已取消对'+n.n+'的关注':'已建议'+n.n+'关注节点状态'}')">${sl}</button><button class="btn btn-sm btn-ghost" onclick="T('负责人：${n.c}')"><i class="fas fa-phone"></i></button></td></tr>`}).join('')}
function T(m){const t=document.getElementById('toast');t.innerHTML=`<i class="fas fa-info-circle"></i> ${m}`;t.className='toast show';setTimeout(()=>t.className='toast',2500)}
R();
</script>
</body>
