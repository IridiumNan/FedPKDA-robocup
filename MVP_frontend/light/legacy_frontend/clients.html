<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>客户端管理 · FedPKDA</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      :root {
        --bg-base: #05070a;
        --bg-surface: rgba(18, 24, 34, 0.65);
        --bg-surface-solid: #10151f;
        --bg-surface-hover: rgba(30, 41, 59, 0.7);
        --border-light: rgba(255, 255, 255, 0.06);
        --border-focus: rgba(88, 166, 255, 0.4);
        --primary: #58a6ff;
        --primary-hover: #3182ce;
        --success: #3fb950;
        --warning: #d29922;
        --text-main: #f0f6fc;
        --text-muted: #8b949e;
        --font-family:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-family);
        background: var(--bg-base);
        /* 添加高级的深色径向渐变背景 */
        background-image:
          radial-gradient(circle at 15% 0%, #162032 0%, transparent 40%),
          radial-gradient(circle at 85% 100%, #111a26 0%, transparent 40%);
        color: var(--text-main);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* 自定义滚动条 */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* 左侧导航栏 */
      :root {
        --bg-sidebar: #0a0f1d;
        --border-color: rgba(45, 55, 85, 0.5);
        --text-main: #f0f4f8;
        --text-muted: #7e8c9f;
        --accent-primary: #58a6ff;
        --accent-success: #3fb950;
        --accent-glow: rgba(88, 166, 255, 0.15);
      }

      .sidebar {
        width: 260px;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        padding: 32px 20px;
        flex-shrink: 0;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
        z-index: 10;
      }
      .sidebar .logo {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 40px;
        padding-left: 10px;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
      }
      .sidebar .logo i {
        color: var(--accent-primary);
        margin-right: 12px;
        filter: drop-shadow(0 0 8px var(--accent-glow));
      }
      .sidebar .logo span {
        color: var(--accent-primary);
        font-weight: 400;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 12px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        margin-bottom: 8px;
        cursor: pointer;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
        font-family: inherit;
      }
      .nav-item i {
        width: 22px;
        font-size: 1.15rem;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-main);
        transform: translateX(4px);
      }
      .nav-item.active {
        background: linear-gradient(
          90deg,
          rgba(88, 166, 255, 0.12) 0%,
          rgba(88, 166, 255, 0.02) 100%
        );
        color: var(--accent-primary);
        border-left: 4px solid var(--accent-primary);
        font-weight: 600;
      }
      .sidebar-footer {
        margin-top: auto;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.8rem;
        color: #4c566a;
        display: flex;
        align-items: center;
      }
      .sidebar-footer i {
        margin-right: 8px;
      }

      /* 主体区域 */
      .main {
        flex: 1;
        overflow-y: auto;
        padding: 32px 40px 60px;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 36px;
        flex-wrap: wrap;
        gap: 20px;
      }
      .page-header h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 8px;
      }
      .page-header h1 i {
        background: -webkit-linear-gradient(45deg, var(--primary), #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 1.8rem;
      }
      .page-header .sub {
        color: var(--text-muted);
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* 卡片高级毛玻璃材质 */
      .card {
        background: var(--bg-surface);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-light);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }
      .card:hover {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-light);
      }
      .card-header h3 {
        font-size: 1.05rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-header h3 i {
        color: var(--primary);
      }

      /* 徽标 */
      .badge {
        background: rgba(255, 255, 255, 0.05);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.8rem;
        color: var(--text-muted);
        border: 1px solid var(--border-light);
        font-weight: 500;
      }
      .badge span {
        color: var(--text-main);
        font-weight: 600;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }

      /* 客户端列表项 */
      .client-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 8px;
        background: rgba(255, 255, 255, 0.01);
        border: 1px solid transparent;
        transition: all 0.2s ease;
      }
      .client-item:hover {
        background: var(--bg-surface-hover);
        border-color: var(--border-light);
        transform: translateY(-2px);
      }
      .client-info {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* 高级感头像：使用渐变色 */
      .client-avatar {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-main);
        font-weight: 700;
        font-size: 1.1rem;
        box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05);
      }

      /* 呼吸灯状态点 */
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        box-shadow: 0 0 8px currentColor;
      }
      @keyframes pulse-online {
        0% {
          box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.6);
        }
        70% {
          box-shadow: 0 0 0 6px rgba(63, 185, 80, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(63, 185, 80, 0);
        }
      }
      @keyframes pulse-training {
        0% {
          box-shadow: 0 0 0 0 rgba(88, 166, 255, 0.6);
        }
        70% {
          box-shadow: 0 0 0 6px rgba(88, 166, 255, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(88, 166, 255, 0);
        }
      }
      .status-dot.online {
        background: var(--success);
        color: var(--success);
        animation: pulse-online 2s infinite;
      }
      .status-dot.training {
        background: var(--primary);
        color: var(--primary);
        animation: pulse-training 2s infinite;
      }
      .status-dot.idle {
        background: var(--warning);
        color: var(--warning);
        opacity: 0.8;
      }

      /* 柔和风格标签 */
      .tag {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        border: 1px solid transparent;
      }
      .tag.primary {
        background: rgba(63, 185, 80, 0.1);
        color: var(--success);
        border-color: rgba(63, 185, 80, 0.2);
      }
      .tag.warning {
        background: rgba(88, 166, 255, 0.1);
        color: var(--primary);
        border-color: rgba(88, 166, 255, 0.2);
      }
      .tag.idle {
        background: rgba(210, 153, 34, 0.1);
        color: var(--warning);
        border-color: rgba(210, 153, 34, 0.2);
      }

      /* 按钮重构 */
      .btn {
        padding: 10px 20px;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
      }
      .btn-primary {
        background: linear-gradient(135deg, #1f6feb 0%, #3182ce 100%);
        color: #fff;
        box-shadow: 0 4px 14px rgba(31, 111, 235, 0.3);
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #3182ce 0%, #1f6feb 100%);
        box-shadow: 0 6px 20px rgba(31, 111, 235, 0.4);
        transform: translateY(-1px);
      }
      .btn-outline {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-light);
        color: var(--text-main);
      }
      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
      }
      .btn-sm {
        padding: 6px 14px;
        font-size: 0.75rem;
      }

      /* 表单与输入框 */
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        color: var(--text-muted);
        font-size: 0.85rem;
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-light);
        border-radius: 10px;
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.9rem;
        transition: all 0.2s;
        outline: none;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--border-focus);
        background: rgba(0, 0, 0, 0.4);
      }
      select option {
        background: var(--bg-surface-solid);
      }

      /* 数据面板阵列布局 */
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      .stat-box {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border-light);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .stat-title {
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 500;
      }
      .stat-value {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-main);
      }

      .hetero-box {
        background: linear-gradient(
          145deg,
          rgba(210, 153, 34, 0.1) 0%,
          rgba(0, 0, 0, 0) 100%
        );
        border: 1px solid rgba(210, 153, 34, 0.2);
        padding: 14px 16px;
        border-radius: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* 图表区域 */
      .chart-wrap {
        margin-top: 24px;
        background: rgba(0, 0, 0, 0.15);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid var(--border-light);
      }
      .chart-row {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      #statusChart {
        width: 130px;
        height: 130px;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
      }
      .chart-legend {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.85rem;
        background: rgba(255, 255, 255, 0.02);
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }
      .legend-left {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-muted);
      }
      .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        box-shadow: 0 0 8px currentColor;
      }
      .color-online {
        background: var(--success);
        color: var(--success);
      }
      .color-train {
        background: var(--primary);
        color: var(--primary);
      }
      .color-idle {
        background: var(--warning);
        color: var(--warning);
      }
      .legend-val {
        font-weight: 700;
        font-size: 1rem;
        color: var(--text-main);
      }

      /* 适配响应式 */
      @media (max-width: 1024px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 640px) {
        .sidebar {
          display: none;
        }
        .main {
          padding: 20px;
        }
        .page-header h1 {
          font-size: 1.6rem;
        }
        .chart-row {
          flex-direction: column;
          align-items: center;
        }
        .chart-legend {
          width: 100%;
        }
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- 左侧导航 -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fas fa-shield-alt"></i>Fed<span>PKDA</span>
      </div>
      <nav style="flex: 1">
        <a href="dashboard.html" class="nav-item">
          <i class="fas fa-chart-pie"></i>仪表盘
        </a>
        <a href="clients.html" class="nav-item active">
          <i class="fas fa-server"></i>客户端管理
        </a>
        <a href="training.html" class="nav-item">
          <i class="fas fa-microchip"></i>联邦训练
        </a>
        <a href="privacy.html" class="nav-item">
          <i class="fas fa-lock"></i>隐私策略
        </a>
        <a href="audit.html" class="nav-item">
          <i class="fas fa-history"></i>审计日志
        </a>
        <a href="index.html" class="nav-item">
          <i class="fas fa-home"></i>首页
        </a>
      </nav>
      <div class="sidebar-footer">
        <i
          class="fas fa-circle"
          style="
            color: #3fb950;
            font-size: 0.5rem;
            box-shadow: 0 0 6px #3fb950;
            border-radius: 50%;
          "
        ></i>
        系统运行中 · v2.4
      </div>
    </aside>

    <!-- 主体区域 -->
    <main class="main">
      <div class="page-header">
        <div>
          <h1><i class="fas fa-server"></i>客户端管理</h1>
          <div class="sub">
            <i class="fas fa-database"></i> 管理所有参与客户端 ·
            数据规模与隐私配置
          </div>
        </div>
        <button class="btn btn-primary">
          <i class="fas fa-plus"></i>注册客户端
        </button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>
            <i class="fas fa-list"></i>已注册客户端 (<span id="clientTotal"
              >8</span
            >)
          </h3>
          <span class="badge">
            <span><span id="onlineCount">5</span> 在线</span> &nbsp;·&nbsp;
            <span><span id="trainingCount">3</span> 训练中</span>
          </span>
        </div>
        <div id="clientList">
          <!-- 动态由JS生成 -->
        </div>
      </div>

      <div class="grid-2">
        <!-- 隐私配置面板 -->
        <div class="card" style="display: flex; flex-direction: column">
          <div class="card-header">
            <h3><i class="fas fa-sliders-h"></i>批量隐私配置</h3>
          </div>
          <div style="flex: 1">
            <div class="form-group">
              <label>默认差分隐私 ε (Epsilon)</label>
              <input type="number" id="defaultEpsilon" value="2.0" step="0.1" />
            </div>
            <div class="form-group">
              <label>客户端本地模式</label>
              <select>
                <option>差分隐私 (DP-SGD)</option>
                <option>同态加密 (HE)</option>
                <option>本地差分隐私 (LDP)</option>
                <option>安全聚合 (SecAgg)</option>
              </select>
            </div>
          </div>
          <button class="btn btn-primary" style="width: 100%; margin-top: 10px">
            <i class="fas fa-save"></i>应用到所有客户端
          </button>
        </div>

        <!-- 数据统计面板 -->
        <div class="card">
          <div class="card-header">
            <h3><i class="fas fa-chart-simple"></i>客户端数据统计</h3>
          </div>

          <!-- 重构为微卡片阵列，原文本和逻辑保留 -->
          <div class="stats-grid">
            <div class="stat-box">
              <span class="stat-title">总数据量</span>
              <span class="stat-value" id="totalData">13.0 GB</span>
            </div>
            <div class="stat-box">
              <span class="stat-title">平均数据量</span>
              <span class="stat-value" id="avgData">1.63 GB</span>
            </div>
            <div class="stat-box">
              <span class="stat-title">最大数据量</span>
              <span class="stat-value" id="maxData">4.2 GB (车载)</span>
            </div>
            <div class="stat-box">
              <span class="stat-title">最小数据量</span>
              <span class="stat-value" id="minData">0.6 GB (终端)</span>
            </div>
          </div>

          <div class="hetero-box mt-2">
            <span style="font-size: 0.9rem; font-weight: 500"
              >数据异构指数</span
            >
            <span
              style="color: var(--warning); font-weight: 700"
              id="heteroIndex"
              >0.73 (高度异构)</span
            >
          </div>

          <!-- 环形图表区域 -->
          <div class="chart-wrap">
            <div class="chart-row">
              <canvas id="statusChart"></canvas>
              <div class="chart-legend">
                <div class="legend-item">
                  <div class="legend-left">
                    <span class="legend-color color-online"></span> 在线客户端
                  </div>
                  <b class="legend-val" id="legOnline">0</b>
                </div>
                <div class="legend-item">
                  <div class="legend-left">
                    <span class="legend-color color-train"></span> 训练中客户端
                  </div>
                  <b class="legend-val" id="legTrain">0</b>
                </div>
                <div class="legend-item">
                  <div class="legend-left">
                    <span class="legend-color color-idle"></span> 空闲客户端
                  </div>
                  <b class="legend-val" id="legIdle">0</b>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      (function () {
        const clientNames = [
          "医疗影像-01",
          "金融风控-03",
          "智能终端-A7",
          "政务数据-02",
          "车载感知-09",
          "边缘节点-12",
          "IoT传感器-04",
          "云端推理-08",
        ];
        // 为头像匹配不同的基础色调
        const clientAvatars = ["M", "F", "T", "G", "V", "E", "I", "C"];
        const privModes = [
          "差分隐私 ε=2.0",
          "同态加密",
          "LDP δ=0.01",
          "差分隐私 ε=1.5",
          "安全聚合",
          "差分隐私 ε=2.5",
          "同态加密",
          "安全聚合",
        ];

        let clients = clientNames.map((name, i) => ({
          name,
          avatar: clientAvatars[i],
          data: 0.5 + Math.random() * 4.5,
          acc: 82 + Math.random() * 14,
          rounds: Math.floor(Math.random() * 25) + 1,
          status: ["online", "training", "idle"][Math.floor(Math.random() * 3)],
          priv: privModes[i % privModes.length],
        }));

        function clamp(v, min, max) {
          return Math.min(max, Math.max(min, v));
        }
        function randDelta(range) {
          return (Math.random() - 0.5) * range;
        }

        // 升级版：高视觉质量环形图绘制
        function drawChart(online, train, idle) {
          const canvas = document.getElementById("statusChart");
          // 适配高分屏抗锯齿
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;

          const ctx = canvas.getContext("2d");
          ctx.scale(dpr, dpr);

          const w = rect.width;
          const h = rect.height;
          const centerX = w / 2;
          const centerY = h / 2;
          // 更纤细且现代的环
          const outerR = Math.min(w, h) / 2 - 8;
          const innerR = outerR * 0.75;

          const total = online + train + idle;
          const data = [online, train, idle];
          // 对应绿、蓝、黄，并调整亮度以配合暗色背景
          const colors = ["#3fb950", "#58a6ff", "#d29922"];
          let startAngle = -0.5 * Math.PI;

          ctx.clearRect(0, 0, w, h);

          data.forEach((val, i) => {
            if (val <= 0) return;
            const percent = val / total;
            // 计算环形间隙 (Gap)
            const gap = 0.08;
            const endAngle = startAngle + 2 * Math.PI * percent;

            ctx.beginPath();
            ctx.arc(centerX, centerY, outerR, startAngle + gap, endAngle - gap);
            ctx.arc(
              centerX,
              centerY,
              innerR,
              endAngle - gap,
              startAngle + gap,
              true,
            );

            // 填充颜色并增加发光效果
            ctx.fillStyle = colors[i];
            ctx.shadowColor = colors[i];
            ctx.shadowBlur = 10;
            ctx.fill();

            // 重置阴影以免影响后续绘制
            ctx.shadowBlur = 0;
            startAngle = endAngle;
          });

          // 更新图例数字
          document.getElementById("legOnline").textContent = online;
          document.getElementById("legTrain").textContent = train;
          document.getElementById("legIdle").textContent = idle;
        }

        function renderClients() {
          const container = document.getElementById("clientList");
          container.innerHTML = "";
          let online = 0,
            training = 0,
            idle = 0,
            totalData = 0;
          let maxD = 0,
            minD = 999,
            maxName = "",
            minName = "";

          clients.forEach((c, idx) => {
            if (c.status === "online") online++;
            else if (c.status === "training") training++;
            else idle++;

            totalData += c.data;
            if (c.data > maxD) {
              maxD = c.data;
              maxName = c.name;
            }
            if (c.data < minD) {
              minD = c.data;
              minName = c.name;
            }

            const statusMap = {
              online: "在线",
              training: "训练中",
              idle: "空闲",
            };
            const tagMap = {
              online: "primary",
              training: "warning",
              idle: "idle",
            };

            // 动态渐变生成（仅为展示高级感）
            const hue = (idx * 40) % 360;
            const avatarBg = `linear-gradient(135deg, hsl(${hue}, 40%, 25%) 0%, #0f172a 100%)`;

            const div = document.createElement("div");
            div.className = "client-item";
            div.innerHTML = `
            <div class="client-info">
              <div class="client-avatar" style="background: ${avatarBg}">${c.avatar}</div>
              <div>
                <strong style="font-size: 1.05rem;">${c.name}</strong>
                <div style="font-size:0.8rem; color: var(--text-muted); margin-top: 4px;">
                  <i class="fas fa-database" style="font-size: 0.7rem; margin-right: 4px;"></i>${c.data.toFixed(1)}GB &nbsp;&middot;&nbsp; 
                  <i class="fas fa-shield-alt" style="font-size: 0.7rem; margin-right: 4px;"></i>${c.priv} &nbsp;&middot;&nbsp; 参与 ${c.rounds} 轮
                </div>
              </div>
            </div>
            <div style="display: flex; align-items: center;">
              <span class="status-dot ${c.status}"></span>
              <span class="tag ${tagMap[c.status]}">${statusMap[c.status]}</span>
              <button class="btn btn-outline btn-sm" style="margin-left:16px; border-radius: 8px;">
                <i class="fas fa-edit"></i>
              </button>
            </div>
          `;
            container.appendChild(div);
          });

          document.getElementById("onlineCount").textContent = online;
          document.getElementById("trainingCount").textContent = training;
          document.getElementById("clientTotal").textContent = clients.length;
          document.getElementById("totalData").textContent =
            totalData.toFixed(1) + " GB";
          document.getElementById("avgData").textContent =
            (totalData / clients.length).toFixed(2) + " GB";
          document.getElementById("maxData").textContent =
            maxD.toFixed(1) + " GB (" + maxName + ")";
          document.getElementById("minData").textContent =
            minD.toFixed(1) + " GB (" + minName + ")";

          // 异构指数
          const avg = totalData / clients.length;
          let variance = 0;
          clients.forEach((c) => (variance += Math.pow(c.data - avg, 2)));
          variance = variance / clients.length;
          const hetero = Math.min(1, Math.sqrt(variance) / 2.5);
          document.getElementById("heteroIndex").textContent =
            hetero.toFixed(2) +
            " (" +
            (hetero > 0.6
              ? "高度异构"
              : hetero > 0.3
                ? "中度异构"
                : "低度异构") +
            ")";

          // 更新默认epsilon
          document.getElementById("defaultEpsilon").value = (
            1.5 +
            Math.random() * 1.5
          ).toFixed(1);

          // 绘制环形图
          drawChart(online, training, idle);
        }

        function updateClients() {
          clients.forEach((c) => {
            c.data = clamp(c.data + randDelta(0.3), 0.3, 5.8);
            c.acc = clamp(c.acc + randDelta(0.8), 80, 97);
            c.rounds = Math.max(1, c.rounds + Math.floor(randDelta(2)));
            if (Math.random() > 0.7) {
              const statuses = ["online", "training", "idle"];
              c.status = statuses[Math.floor(Math.random() * 3)];
            }
          });
          renderClients();
        }

        // 初始化
        setTimeout(renderClients, 50); // 确保DOM就绪获取画布宽高度
        setInterval(updateClients, 2500);
      })();
    </script>
  </body>
</html>
