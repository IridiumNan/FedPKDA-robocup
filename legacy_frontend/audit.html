<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>审计日志 · FedPKDA</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        background: #0b0f18;
        background-image: radial-gradient(
          rgba(88, 166, 255, 0.04) 1px,
          transparent 1px
        );
        background-size: 24px 24px;
        color: #e6edf3;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* ============================================
         侧边栏 —— 与 training.html 完全一致的样式
         ============================================ */
      .sidebar {
        width: 260px;
        background: #0a0f1d;
        border-right: 1px solid rgba(45, 55, 85, 0.5);
        display: flex;
        flex-direction: column;
        padding: 32px 20px;
        flex-shrink: 0;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
        z-index: 10;
      }
      .sidebar .logo {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 40px;
        padding-left: 10px;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
      }
      .sidebar .logo i {
        color: #58a6ff;
        margin-right: 12px;
        filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.15));
      }
      .sidebar .logo span {
        color: #58a6ff;
        font-weight: 400;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 12px;
        color: #7e8c9f;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        margin-bottom: 8px;
        cursor: pointer;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
        font-family: inherit;
      }
      .nav-item i {
        width: 22px;
        font-size: 1.15rem;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.03);
        color: #f0f4f8;
        transform: translateX(4px);
      }
      .nav-item.active {
        background: linear-gradient(
          90deg,
          rgba(88, 166, 255, 0.12) 0%,
          rgba(88, 166, 255, 0.02) 100%
        );
        color: #58a6ff;
        border-left: 4px solid #58a6ff;
        font-weight: 600;
      }
      .sidebar-footer {
        margin-top: auto;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.8rem;
        color: #4c566a;
        display: flex;
        align-items: center;
      }
      .sidebar-footer i {
        margin-right: 8px;
      }
      /* ============================================
         侧边栏样式结束
         ============================================ */

      .main {
        flex: 1;
        overflow-y: auto;
        padding: 32px 36px 48px;
        background: transparent;
      }
      .main::-webkit-scrollbar {
        width: 8px;
      }
      .main::-webkit-scrollbar-track {
        background: #0d1117;
        border-radius: 10px;
      }
      .main::-webkit-scrollbar-thumb {
        background: #30363d;
        border-radius: 8px;
      }
      .main::-webkit-scrollbar-thumb:hover {
        background: #484f58;
      }
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 32px;
        flex-wrap: wrap;
        gap: 16px;
      }
      .page-header h1 {
        font-size: 1.9rem;
        font-weight: 600;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .page-header h1 i {
        color: #58a6ff;
        font-size: 1.6rem;
      }
      .page-header .sub {
        color: #8b949e;
        font-size: 0.95rem;
        font-weight: 400;
        margin-top: 6px;
      }
      .badge {
        background: #1f2937;
        padding: 5px 14px;
        border-radius: 22px;
        font-size: 0.75rem;
        color: #8b949e;
        border: 1px solid #30363d;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 28px;
        grid-auto-rows: 340px;
      }
      .card {
        background: #0d1117;
        border: 1px solid #21262d;
        border-radius: 18px;
        padding: 24px;
        transition: all 0.24s ease;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }
      .card:hover {
        border-color: #363b44;
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .card-header h3 {
        font-size: 0.95rem;
        font-weight: 600;
        color: #8b949e;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-header h3 i {
        color: #58a6ff;
      }
      .client-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 8px;
        margin-inline: -8px;
        border-bottom: 1px solid #161b22;
        transition: background 0.2s;
        border-radius: 10px;
      }
      .client-item:hover {
        background: #131820;
      }
      .client-item:last-child {
        border-bottom: none;
      }
      .tag {
        background: #1f2937;
        padding: 3px 12px;
        border-radius: 14px;
        font-size: 0.7rem;
        color: #8b949e;
        border: 1px solid #30363d;
      }
      .tag.primary {
        border-color: #58a6ff;
        color: #58a6ff;
      }
      .tag.success {
        border-color: #3fb950;
        color: #3fb950;
      }
      .tag.warning {
        border-color: #d29922;
        color: #d29922;
      }
      .btn {
        padding: 9px 18px;
        border-radius: 10px;
        border: none;
        font-weight: 500;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.24s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transform: scale(1);
      }
      .btn-outline {
        background: transparent;
        border: 1px solid #30363d;
        color: #c9d1d9;
      }
      .btn-outline:hover {
        border-color: #58a6ff;
        color: #58a6ff;
        transform: scale(1.04);
        box-shadow: 0 0 10px #58a6ff22;
      }
      .btn-sm {
        padding: 5px 14px;
        font-size: 0.75rem;
      }
      .flex {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .flex-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }
      .mt-2 {
        margin-top: 20px;
      }
      .security-panel {
        background: #161b22;
        padding: 16px;
        border-radius: 14px;
        margin-top: 16px;
        border: 1px solid #21262d;
      }
      .security-panel .flex-between {
        margin-bottom: 14px;
      }
      .security-panel .flex-between:last-child {
        margin-bottom: 0;
      }
      .chart-wrap {
        width: 100%;
        height: 180px;
        margin-top: 10px;
        border-top: 1px solid #161b22;
        padding-top: 12px;
      }
      @media (max-width: 1280px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 640px) {
        .sidebar {
          display: none;
        }
        .main {
          padding: 20px;
        }
        .chart-wrap {
          height: 140px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo">
        <i class="fas fa-shield-alt"></i>Fed<span>PKDA</span>
      </div>
      <nav style="flex: 1">
        <a href="dashboard.html" class="nav-item"
          ><i class="fas fa-chart-pie"></i>仪表盘</a
        >
        <a href="clients.html" class="nav-item"
          ><i class="fas fa-server"></i>客户端管理</a
        >
        <a href="training.html" class="nav-item"
          ><i class="fas fa-microchip"></i>联邦训练</a
        >
        <a href="privacy.html" class="nav-item"
          ><i class="fas fa-lock"></i>隐私策略</a
        >
        <a href="audit.html" class="nav-item active"
          ><i class="fas fa-history"></i>审计日志</a
        >
        <a href="index.html" class="nav-item"
          ><i class="fas fa-home"></i>首页</a
        >
      </nav>
      <div class="sidebar-footer">
        <i class="fas fa-circle" style="color: #3fb950; font-size: 0.5rem"></i>
        系统运行中 · v2.4
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <div>
          <h1><i class="fas fa-history"></i>审计日志</h1>
          <div class="sub">
            <i class="fas fa-clipboard-list"></i>
            记录所有训练事件、隐私操作与系统变更
          </div>
        </div>
        <div class="flex">
          <span class="badge"><i class="fas fa-download"></i> 导出日志</span>
          <button class="btn btn-outline btn-sm">
            <i class="fas fa-filter"></i>过滤
          </button>
        </div>
      </div>

      <div class="card" style="margin-bottom: 28px">
        <div class="card-header">
          <h3><i class="fas fa-list-ul"></i>近期事件</h3>
          <span class="badge">最新 <span id="eventCount">20</span> 条</span>
        </div>
        <div id="eventList" style="max-height: 420px; overflow-y: auto"></div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header">
            <h3><i class="fas fa-chart-simple"></i>事件统计趋势</h3>
          </div>
          <div class="chart-wrap">
            <canvas id="eventChart"></canvas>
          </div>
          <div class="mt-2">
            <div class="flex-between" style="margin-bottom: 8px">
              <span>训练事件</span><span id="statTrain">47</span>
            </div>
            <div class="flex-between" style="margin-bottom: 8px">
              <span>隐私操作</span><span id="statPrivacy">12</span>
            </div>
            <div class="flex-between" style="margin-bottom: 8px">
              <span>客户端变更</span><span id="statClient">8</span>
            </div>
            <div class="flex-between">
              <span>对齐事件</span><span id="statAlign">24</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3><i class="fas fa-exclamation-triangle"></i>安全事件监控</h3>
          </div>
          <div style="color: #8b949e; font-size: 0.9rem" id="securityStatus">
            无异常事件
          </div>
          <div class="security-panel">
            <div class="flex-between">
              <span
                ><i class="fas fa-check-circle" style="color: #3fb950"></i>
                最近检查</span
              >
              <span id="lastCheck">2 分钟前</span>
            </div>
            <div class="flex-between">
              <span>隐私预算剩余</span>
              <span id="remainBudget">58%</span>
            </div>
            <div class="flex-between">
              <span>客户端异常</span>
              <span id="clientAbnormal">0</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      (function () {
        const eventTemplates = [
          {
            tag: "primary",
            tagLabel: "训练",
            text: "医疗影像分类 第 {round} 轮完成 · 全局准确率 {acc}%",
          },
          {
            tag: "success",
            tagLabel: "隐私",
            text: "差分隐私预算 更新 ε: {oldE} → {newE}",
          },
          {
            tag: "warning",
            tagLabel: "客户端",
            text: "{client} 加入训练 · 数据量 {data}GB",
          },
          {
            tag: "",
            tagLabel: "对齐",
            text: "FedPKDA 全局原型对齐完成 · 马氏距离 {dist}",
          },
          {
            tag: "primary",
            tagLabel: "训练",
            text: "{task} 第 {round} 轮启动 · {n} 客户端参与",
          },
          {
            tag: "success",
            tagLabel: "隐私",
            text: "同态加密 密钥轮换完成 (CKKS)",
          },
        ];

        const clientNames = [
          "车载感知-09",
          "医疗影像-01",
          "金融风控-03",
          "智能终端-A7",
          "政务数据-02",
        ];
        const taskNames = [
          "金融异常检测",
          "终端意图识别",
          "医疗影像分类",
          "联邦强化学习",
        ];

        let events = [];
        let statTrain = 47,
          statPrivacy = 12,
          statClient = 8,
          statAlign = 24;
        let lastCheck = "2 分钟前";
        let remainBudget = 58;
        let abnormal = 0;

        let chartHistory = {
          train: [statTrain],
          privacy: [statPrivacy],
          client: [statClient],
          align: [statAlign],
          labels: ["初始"],
        };
        let auditChart = null;

        function clamp(v, min, max) {
          return Math.min(max, Math.max(min, v));
        }
        function randDelta(range) {
          return (Math.random() - 0.5) * range;
        }

        function randomTime() {
          const units = ["秒前", "分钟前", "小时前"];
          const unit = units[Math.floor(Math.random() * 3)];
          const val = Math.floor(Math.random() * 30) + 1;
          return val + " " + unit;
        }

        function generateEvent() {
          const template =
            eventTemplates[Math.floor(Math.random() * eventTemplates.length)];
          let text = template.text;
          const round = Math.floor(Math.random() * 30) + 10;
          const acc = (88 + Math.random() * 8).toFixed(1);
          const oldE = (1.5 + Math.random() * 1.5).toFixed(1);
          const newE = (parseFloat(oldE) + (Math.random() - 0.5) * 0.8).toFixed(
            1,
          );
          const client =
            clientNames[Math.floor(Math.random() * clientNames.length)];
          const data = (0.5 + Math.random() * 4.5).toFixed(1);
          const dist = (0.4 + Math.random() * 0.5).toFixed(2);
          const task = taskNames[Math.floor(Math.random() * taskNames.length)];
          const n = Math.floor(Math.random() * 5) + 2;

          text = text
            .replace(/\{round\}/g, round)
            .replace(/\{acc\}/g, acc)
            .replace(/\{oldE\}/g, oldE)
            .replace(/\{newE\}/g, newE)
            .replace(/\{client\}/g, client)
            .replace(/\{data\}/g, data)
            .replace(/\{dist\}/g, dist)
            .replace(/\{task\}/g, task)
            .replace(/\{n\}/g, n);

          return {
            tag: template.tag,
            tagLabel: template.tagLabel,
            text: text,
            time: randomTime(),
          };
        }

        function renderEvents() {
          const container = document.getElementById("eventList");
          container.innerHTML = "";
          while (events.length > 20) events.shift();
          while (events.length < 10) events.push(generateEvent());
          const display = [...events].reverse();
          display.forEach((e) => {
            const div = document.createElement("div");
            div.className = "client-item";
            const tagClass = e.tag ? "tag " + e.tag : "tag";
            const tagStyle = e.tag ? "" : "border-color:#a371f7;color:#a371f7;";
            div.innerHTML = `
              <div><span class="${tagClass}" style="${tagStyle} margin-right:8px;">${e.tagLabel}</span><strong>${e.text}</strong></div>
              <span style="color:#8b949e;font-size:0.75rem;">${e.time}</span>
            `;
            container.appendChild(div);
          });
          document.getElementById("eventCount").textContent = events.length;
        }

        function initChart() {
          const ctx = document.getElementById("eventChart").getContext("2d");
          auditChart = new Chart(ctx, {
            type: "line",
            data: {
              labels: chartHistory.labels,
              datasets: [
                {
                  label: "训练事件",
                  data: chartHistory.train,
                  borderColor: "#58a6ff",
                  backgroundColor: "rgba(88,166,255,0.1)",
                  tension: 0.3,
                  fill: true,
                },
                {
                  label: "隐私操作",
                  data: chartHistory.privacy,
                  borderColor: "#3fb950",
                  backgroundColor: "rgba(63,185,80,0.1)",
                  tension: 0.3,
                  fill: true,
                },
                {
                  label: "客户端变更",
                  data: chartHistory.client,
                  borderColor: "#d29922",
                  backgroundColor: "rgba(210,153,34,0.1)",
                  tension: 0.3,
                  fill: true,
                },
                {
                  label: "对齐事件",
                  data: chartHistory.align,
                  borderColor: "#8250df",
                  backgroundColor: "rgba(130,80,223,0.1)",
                  tension: 0.3,
                  fill: true,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  labels: { color: "#8b949e", boxWidth: 10 },
                },
              },
              scales: {
                x: {
                  grid: { color: "#161b22" },
                  ticks: { color: "#8b949e" },
                },
                y: {
                  grid: { color: "#161b22" },
                  ticks: { color: "#8b949e" },
                },
              },
            },
          });
        }

        function updateChart() {
          chartHistory.train.push(statTrain);
          chartHistory.privacy.push(statPrivacy);
          chartHistory.client.push(statClient);
          chartHistory.align.push(statAlign);
          chartHistory.labels.push("");
          const maxLen = 12;
          if (chartHistory.train.length > maxLen) {
            chartHistory.train.shift();
            chartHistory.privacy.shift();
            chartHistory.client.shift();
            chartHistory.align.shift();
            chartHistory.labels.shift();
          }
          auditChart.update();
        }

        function updateAudit() {
          statTrain = clamp(statTrain + randDelta(2), 30, 70);
          statPrivacy = clamp(statPrivacy + randDelta(1.5), 8, 25);
          statClient = clamp(statClient + randDelta(1.2), 5, 18);
          statAlign = clamp(statAlign + randDelta(2), 15, 40);
          remainBudget = clamp(remainBudget + randDelta(3), 20, 85);
          abnormal = Math.max(
            0,
            abnormal +
              (Math.random() > 0.9 ? 1 : 0) -
              (Math.random() > 0.95 ? 1 : 0),
          );
          abnormal = Math.min(3, Math.max(0, abnormal));

          document.getElementById("statTrain").textContent =
            Math.round(statTrain);
          document.getElementById("statPrivacy").textContent =
            Math.round(statPrivacy);
          document.getElementById("statClient").textContent =
            Math.round(statClient);
          document.getElementById("statAlign").textContent =
            Math.round(statAlign);
          document.getElementById("remainBudget").textContent =
            Math.round(remainBudget) + "%";
          document.getElementById("clientAbnormal").textContent =
            Math.round(abnormal);

          const statusEl = document.getElementById("securityStatus");
          if (abnormal > 0) {
            statusEl.innerHTML =
              '<span style="color:#f85149;"><i class="fas fa-exclamation-circle"></i> 检测到 ' +
              Math.round(abnormal) +
              " 个异常事件</span>";
          } else {
            statusEl.innerHTML =
              '<i class="fas fa-check-circle" style="color:#3fb950;"></i> 无异常事件';
          }

          const mins = Math.floor(Math.random() * 10) + 1;
          lastCheck = mins + " 分钟前";
          document.getElementById("lastCheck").textContent = lastCheck;

          if (Math.random() > 0.4) events.push(generateEvent());
          renderEvents();
          updateChart();
        }

        for (let i = 0; i < 15; i++) events.push(generateEvent());
        renderEvents();
        initChart();
        updateAudit();
        setInterval(updateAudit, 3000);
      })();
    </script>
  </body>
</html>
